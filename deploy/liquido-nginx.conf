# NGINX configuration for VUE SPA
# https://router.vuejs.org/guide/essentials/history-mode.html#nginx

# overwrite /etc/nginx/conf.d/default.conf  with this
server {
		listen 80;
		server_name _;

		root /app;
		index index.html;

		# Redirect /index.html to /  (SPA start page)  <= DOES NOT WORK :-(
		#location = /index.html {
		#	return 301 /;
		#}

		# Main SPA route handling for LIQUIDOD router in webHistoryMode()
		# https://router.vuejs.org/guide/essentials/history-mode.html#nginx
		location / {
				try_files $uri $uri/ /index.html;
		}

		# Optional: Improve caching for static assets (e.g. built JS/CSS files)
		#location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|mp4|webm)$ {
		#    expires 6M;
		#    access_log off;
		#    add_header Cache-Control "public";
		#}

		# Optional: Error pages
		#error_page 404 /index.html;
		error_page 500 502 503 504 /50x.html;

		location = /50x.html {
				root /app;
		}
}

# Hint: /usr/sbin/nginx -s reload